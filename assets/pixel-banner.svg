<path d="M0 198 Q160 190 320 198 T600 196 T880 198 T1200 195" fill="none" stroke="#ff19a8" stroke-width="3" opacity=".85" filter="url(#glow)"/>
<path d="M315 201H885" stroke="#7b20ff" stroke-width="2" opacity=".9"/>
