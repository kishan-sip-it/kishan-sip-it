<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#02030b"/><stop offset=".62" stop-color="#08051a"/><stop offset="1" stop-color="#12052a"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="88%" r="58%">
    <stop offset="0" stop-color="#ff19a8" stop-opacity=".42"/><stop offset=".32" stop-color="#7b16ff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#17062f"/><stop offset="1" stop-color="#050611"/>
  </linearGradient>
  <pattern id="windows" width="15" height="18" patternUnits="userSpaceOnUse">
    <rect x="4" y="4" width="3" height="6" fill="#ff28aa" opacity=".7"/>
    <rect x="10" y="4" width="2" height="6" fill="#6520ff" opacity=".75"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
  <filter id="neon"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="260" fill="url(#bg)"/>
<rect width="1200" height="260" fill="url(#glow)"/>

<!-- pixel stars -->
<g fill="#bd24ff">
  <rect x="72" y="34" width="3" height="3"/><rect x="151" y="67" width="2" height="2"/><rect x="224" y="28" width="3" height="3"/>
  <rect x="302" y="53" width="2" height="2"/><rect x="390" y="24" width="3" height="3"/><rect x="810" y="32" width="3" height="3"/>
  <rect x="900" y="55" width="2" height="2"/><rect x="1000" y="25" width="3" height="3"/><rect x="1090" y="62" width="2" height="2"/><rect x="1150" y="34" width="3" height="3"/>
</g>
<g fill="#32104e" opacity=".8">
  <path d="M18 67h58l10 6H7zM104 50h66l13 7H90zM1030 52h62l14 7h-83zM1115 65h62l12 7h-82z"/>
</g>

<!-- LEFT CITY: tall, dense and pulled toward the edges -->
<g fill="url(#tower)" stroke="#461077" stroke-width="2">
  <path d="M0 202V92h31v110h10V72h45v130h12V118h29v84h12V54h54v148h12V91h39v111h13V126h35v76h13V76h46v126h14V109h37v93h15V136h39v66h15V96h46v106H0Z"/>
</g>
<g fill="url(#windows)">
  <path d="M41 79h45v120H41zM139 61h54v137h-54zM223 98h39v100h-39zM296 83h46v116h-46zM373 103h37v96h-37zM425 75h46v124h-46z"/>
</g>

<!-- RIGHT CITY: mirror composition -->
<g fill="url(#tower)" stroke="#461077" stroke-width="2">
  <path d="M1200 202V82h-31v120h-11V63h-45v139h-12V109h-30v93h-12V50h-55v152h-12V88h-39v114h-13V121h-35v81h-13V75h-46v127h-14V108h-37v94h-15V135h-39v67h-15V94h-46v108h-19V202Z"/>
</g>
<g fill="url(#windows)">
  <path d="M1159 69h41v130h-41zM1051 57h55v142h-55zM964 92h39v107h-39zM891 78h46v121h-46zM812 101h38v98h-38zM758 73h46v126h-46z"/>
</g>

<!-- distant low skyline only at the far edges; center remains clean -->
<g fill="#100a22" stroke="#32105c" stroke-width="1.5">
  <path d="M0 202h80v-23h18v23h17v-34h21v34h15v-17h18v17h20v-27h24v27h18v-16h22v16h20v-20h24v20h25v-12h25v12H0Z"/>
  <path d="M1200 202h-80v-23h-18v23h-17v-34h-21v34h-15v-17h-18v17h-20v-27h-24v27h-18v-16h-22v16h-20v-20h-24v20h-25v-12h-25v12h249Z"/>
</g>

<!-- neon horizon -->
<path d="M0 205 Q155 197 310 205 T600 203 T890 205 T1200 202" fill="none" stroke="#ff18aa" stroke-width="3" filter="url(#neon)"/>
<path d="M330 209H870" stroke="#8125ff" stroke-width="2"/>
<ellipse cx="600" cy="208" rx="270" ry="14" fill="#e000ff" opacity=".1" filter="url(#neon)"/>

<!-- large, unobstructed title area -->
<text x="600" y="119" text-anchor="middle" font-family="monospace" font-size="58" font-weight="900" letter-spacing="1.2" fill="#f8f7ff" stroke="#ffffff" stroke-width=".7">Kishan Marwadi</text>
<text x="600" y="153" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#18e9ff">Full-Stack Developer | AI Systems Builder</text>

<!-- tiny horizon city lights -->
<g fill="#ff2ba9">
  <rect x="292" y="198" width="4" height="4"/><rect x="323" y="201" width="3" height="3"/><rect x="876" y="199" width="4" height="4"/><rect x="908" y="201" width="3" height="3"/>
</g>

<rect width="1200" height="260" fill="url(#scan)"/>
</svg>
