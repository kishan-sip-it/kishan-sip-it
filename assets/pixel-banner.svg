<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#03040d"/><stop offset=".65" stop-color="#09051a"/><stop offset="1" stop-color="#120526"/>
  </linearGradient>
  <radialGradient id="horizon" cx="50%" cy="92%" r="62%">
    <stop offset="0" stop-color="#ff159f" stop-opacity=".34"/><stop offset=".35" stop-color="#6511b9" stop-opacity=".16"/><stop offset="1" stop-color="#05050f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#17052f"/><stop offset="1" stop-color="#050613"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".035"/></pattern>
  <pattern id="windows" width="18" height="22" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="4" height="7" fill="#ff2ca8" opacity=".65"/><rect x="12" y="5" width="3" height="7" fill="#6418ff" opacity=".7"/></pattern>
</defs>

<rect width="1200" height="260" fill="url(#bg)"/>
<rect width="1200" height="260" fill="url(#horizon)"/>

<!-- pixel stars / clouds -->
<g fill="#b000ff" opacity=".85">
  <rect x="82" y="34" width="3" height="3"/><rect x="170" y="63" width="2" height="2"/><rect x="266" y="28" width="3" height="3"/>
  <rect x="365" y="52" width="2" height="2"/><rect x="474" y="25" width="3" height="3"/><rect x="724" y="36" width="3" height="3"/>
  <rect x="824" y="22" width="2" height="2"/><rect x="930" y="58" width="3" height="3"/><rect x="1050" y="30" width="2" height="2"/><rect x="1134" y="53" width="3" height="3"/>
</g>
